backend:
  name: github
  repo: dgiacone/interpreting-works
  branch: main
  base_url: https://interpreting.works
  auth_endpoint: /api/auth

media_folder: public/img/blog
public_folder: /img/blog

locale: en

collections:
  - name: blog
    label: Blog Posts
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish Date, name: pubDate, widget: datetime, format: "YYYY-MM-DD" }
      - { label: Description, name: description, widget: text }
      - { label: Author, name: author, widget: string, default: interpretingWorks }
      - { label: Cover Image, name: image, widget: image, required: false, hint: "Upload a 16:9 image (1200×675 px recommended)" }
      - label: Tags
        name: tags
        widget: list
        field: { label: Tag, name: tag, widget: string }
        hint: "e.g. Healthcare, OPI, VRI, Compliance"
      - { label: Draft, name: draft, widget: boolean, default: false, hint: "Check to keep this post unpublished" }
      - { label: Body, name: body, widget: markdown }
